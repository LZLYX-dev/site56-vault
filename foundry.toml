[profile.default]
src = "src"
test = "test"
out = "out-foundry"
cache_path = "cache-foundry"
libs = ["lib", "node_modules"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@openzeppelin-contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"
]
